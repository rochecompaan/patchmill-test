<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eef5f0">
<link rel="icon" href="data:,">
<title>Create a poll — planning mockup</title>
<style>
:root{color-scheme:light;font-family:"Trebuchet MS",Arial,sans-serif;color:#173b2c;background:#eef5f0}*{box-sizing:border-box}body{margin:0;padding:64px 20px}main{max-width:960px;margin:auto;border-top:8px solid #23613f;border-radius:8px;background:#fff;overflow-wrap:anywhere}header{padding:48px}h1{margin:0 0 20px;font-size:clamp(2rem,4.5vw,3.25rem);line-height:1.12;letter-spacing:-.035em}h2{margin:0 0 14px;font-size:24px;line-height:1.25}p{max-width:65ch;margin:0;color:#425b50;line-height:1.6;font-size:18px}.note{margin-top:28px;font-size:16px}.poll-areas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid #c7d8ce}section{padding:36px 48px 48px;min-width:0}section+section{border-left:1px solid #c7d8ce}section p{font-size:16px}label{display:block;margin-bottom:8px}input{width:100%;min-width:0;min-height:44px;padding:10px 12px;border:1px solid #425b50;border-radius:4px;font:inherit;color:inherit;background:#fff}fieldset{min-width:0;margin:24px 0 0;padding:0;border:0}legend{padding:0;margin-bottom:16px;font-weight:bold}.field+.field{margin-top:16px}button{min-height:44px;padding:10px 16px;font:inherit;border:1px solid #23613f;border-radius:4px;cursor:pointer;background:#fff;color:#23613f}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.primary{background:#23613f;color:#fff}:focus-visible{outline:3px solid #23613f;outline-offset:5px}.skip-link{position:absolute;top:12px;left:20px;padding:12px;background:#fff;color:#23613f;transform:translateY(-200%)}.skip-link:focus{transform:none}[role=alert]{margin:16px 0;font-weight:bold}li{margin:12px 0;line-height:1.5}ul{padding-left:24px}[hidden]{display:none!important}@media(max-width:639px){body{padding:32px 20px}header,section{padding:28px 24px}.poll-areas{grid-template-columns:minmax(0,1fr)}section+section{border-left:0;border-top:1px solid #c7d8ce}}
/* No animation or transitions, including under reduced-motion preferences. */
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<main id="main" tabindex="-1">
<header><h1 translate="no">Team Lunch Poll</h1><p>Decide where or what to eat together. Create a lunch poll, vote as a team, and see the results.</p><p class="note">This poll stays until you refresh or close this page.</p></header>
<div class="poll-areas">
<section aria-labelledby="create-heading">
<h2 id="create-heading">Create a poll</h2>
<form id="create-form" novalidate aria-describedby="form-error">
<label for="question">Poll question</label><input id="question" name="question" required placeholder="Where shall we eat lunch?">
<fieldset><legend>Lunch options</legend><div id="options">
<div class="field"><label for="option-1">Option 1</label><input id="option-1" name="option" required placeholder="For example, the corner deli"></div>
<div class="field"><label for="option-2">Option 2</label><input id="option-2" name="option" required placeholder="For example, pizza"></div>
</div></fieldset>
<p id="form-error" role="alert" hidden></p>
<div class="actions"><button id="add-option" type="button">Add option</button><button class="primary" type="submit">Save poll</button></div>
</form>
<div id="saved" hidden><ul id="saved-options"></ul></div>
</section>
<section aria-labelledby="results-heading"><h2 id="results-heading">Poll results</h2><p>Voting and results are not available yet.</p></section>
</div>
</main>
<script>
const form=document.querySelector('form');
const options=document.querySelector('#options');
document.querySelector('#add-option').addEventListener('click',()=>{
 const n=options.children.length+1;
 const field=document.createElement('div');field.className='field';
 const label=document.createElement('label');label.htmlFor=`option-${n}`;label.textContent=`Option ${n}`;
 const input=document.createElement('input');input.id=label.htmlFor;input.name='option';input.required=true;
 field.append(label,input);options.append(field);input.focus();
});
form.addEventListener('submit',event=>{
 event.preventDefault();
 const inputs=[...form.querySelectorAll('input')];
 const blank=inputs.find(input=>!input.value.trim());
 if(blank){const error=document.querySelector('#form-error');error.hidden=false;error.textContent='Enter a question and at least two options. Fill in every option.';blank.focus();return;}
 const heading=document.querySelector('#create-heading');heading.textContent=inputs[0].value.trim();heading.tabIndex=-1;
 const list=document.querySelector('#saved-options');
 inputs.slice(1).forEach(input=>{const li=document.createElement('li');li.textContent=input.value.trim();list.append(li);});
 form.hidden=true;document.querySelector('#saved').hidden=false;heading.focus();
});
</script>
</body>
</html>
