<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f2edf8">
    <title>Team Lunch Poll</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Team Lunch Poll</h1>
        <p>Help your team decide where or what to eat for lunch.</p>
      </header>
      <section aria-labelledby="workspace-heading">
        <h2 id="workspace-heading">Poll workspace</h2>
        <div class="notices">
          <div class="notice" id="creation">
            <h3>Create a poll</h3>
            <form id="create-poll-form" novalidate>
              <div class="field">
                <label for="poll-question">Poll question</label>
                <input id="poll-question" name="question" type="text" disabled>
              </div>
              <p id="poll-error" role="alert"></p>
              <fieldset aria-describedby="options-hint">
                <legend>Lunch options</legend>
                <p id="options-hint">Enter at least two lunch options.</p>
                <div id="option-fields">
                  <div class="field">
                    <label for="option-1">Option 1</label>
                    <input id="option-1" name="option" type="text" disabled>
                  </div>
                  <div class="field">
                    <label for="option-2">Option 2</label>
                    <input id="option-2" name="option" type="text" disabled>
                  </div>
                </div>
              </fieldset>
              <div class="actions">
                <button id="add-option" type="button" disabled>Add option</button>
                <button type="submit" disabled>Save poll</button>
              </div>
            </form>
          </div>
          <div class="notice">
            <h3>Results</h3>
            <p>Voting results will appear here.</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
