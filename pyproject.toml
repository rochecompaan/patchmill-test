[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "team-lunch-poll"
version = "0.1.0"
description = "A lightweight app for team lunch decisions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["team_lunch_poll*"]

[tool.setuptools.package-data]
team_lunch_poll = ["templates/*.html", "static/*.css"]

[tool.ruff]
target-version = "py311"
line-length = 88
